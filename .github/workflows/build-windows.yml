name: Build Windows EXE

# Un seul fichier : GestionCommerciale.exe (PyInstaller onefile).
on:
  push:
    branches:
      - "cursor/**"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests (bloque le build en cas d'échec)
        env:
          QT_QPA_PLATFORM: offscreen
          NEXAPOS_SKIP_ACTIVATION: "1"
        run: python -m unittest discover -s tests

      - name: Générer GestionCommerciale.exe (onefile)
        run: pyinstaller gestion_app.spec --noconfirm

      - name: Vérifier les modules dans l'EXE
        run: python scripts/verify_exe_modules.py dist/GestionCommerciale.exe

      - name: Afficher la taille de l'EXE
        shell: pwsh
        run: |
          Get-Item dist/GestionCommerciale.exe | Format-List Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}, FullName

      - name: Nommer l'EXE avec sa version
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item dist/GestionCommerciale.exe "dist/GestionCommerciale-v$v.exe"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publier GestionCommerciale.exe
        uses: actions/upload-artifact@v4
        with:
          name: GestionCommerciale-Windows
          path: |
            dist/GestionCommerciale.exe
            dist/GestionCommerciale-v*.exe
          if-no-files-found: error

      - name: Publier une release (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GestionCommerciale-v*.exe
