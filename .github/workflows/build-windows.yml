name: Build Windows EXE

# Un seul fichier : GestionCommerciale.exe (PyInstaller onefile).
on:
  push:
    branches:
      - "cursor/**"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Générer GestionCommerciale.exe (onefile)
        run: pyinstaller gestion_app.spec --noconfirm

      - name: Vérifier les modules dans l'EXE
        run: python scripts/verify_exe_modules.py dist/GestionCommerciale.exe

      - name: Afficher la taille de l'EXE
        shell: pwsh
        run: |
          Get-Item dist/GestionCommerciale.exe | Format-List Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}, FullName

      - name: Publier GestionCommerciale.exe
        uses: actions/upload-artifact@v4
        with:
          name: GestionCommerciale-Windows
          path: dist/GestionCommerciale.exe
          if-no-files-found: error
