name: Build Windows EXE

# Construit un seul .exe (onefile) et le publie comme artefact.
on:
  push:
    branches:
      - "cursor/**"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Générer l'exécutable onefile avec PyInstaller
        run: pyinstaller gestion_app.spec --noconfirm

      - name: Vérifier les modules critiques dans l'EXE
        run: python scripts/verify_exe_modules.py dist/GestionCommerciale.exe

      - name: Publier GestionCommerciale.exe (1 fichier)
        uses: actions/upload-artifact@v4
        with:
          name: GestionCommerciale-Windows
          path: |
            dist/GestionCommerciale.exe
            dist/GestionCommerciale_console.exe
          if-no-files-found: error
